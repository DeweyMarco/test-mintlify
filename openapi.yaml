openapi: 3.1.0
info:
  title: Quotes API
  license:
    name: MIT
    identifier: MIT
  description: |
    A lightweight, **unauthenticated** REST API that returns JSON only. Use it to list quotes,
    fetch a random quote, look up a quote by id, and discover valid categories.

    All error responses share the same envelope: `error` (machine-readable code) and `message`
    (human-readable detail).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server (production URL coming soon)

# Public API — no authentication
security: []

tags:
  - name: Quotes
    description: Retrieve quotes
  - name: Categories
    description: Explore available categories

paths:
  /quotes:
    get:
      # ------------------------------------------------------------------
      # ⚠️  This is the "poorly written" baseline you'd often inherit from
      #     an engineering team. Short, vague, no examples in the prose.
      # ------------------------------------------------------------------
      summary: Get quotes
      description: Returns quotes.
      operationId: listQuotes
      tags:
        - Quotes
      # ------------------------------------------------------------------
      # ✅  Mintlify override using the `x-mint` extension. Everything in
      #     `x-mint.metadata` overrides the rendered page metadata, and
      #     `x-mint.content` injects custom MDX above the auto-generated
      #     parameter and response docs.
      # ------------------------------------------------------------------
      x-mint:
        metadata:
          title: List quotes with filters and pagination
          sidebarTitle: List quotes
          description: |
            Retrieve a paginated-style list of quotes, optionally narrowed to a single category and
            capped to a maximum result count. Ideal for building category browsers, daily-quote
            widgets, or any UI that needs more than a single random quote at a time.
          og:title: List quotes — Quotes API
          og:description: Paginate, filter, and cap quote results from the Quotes API.
        content: |
          <Note>
            **When to use this endpoint.** Reach for `GET /quotes` whenever you need more than one
            quote at a time — for example, to render a category page, prefetch a carousel, or
            populate a search index. For a single quote on demand, use
            [`GET /quotes/random`](/api-reference/get-random-quote) instead.
          </Note>

          <Tip>
            Combine `category` and `limit` to build lightweight category previews:
            `GET /quotes?category=wisdom&limit=3` returns the first three wisdom quotes plus a
            `total` counter you can use for "X of Y" UI affordances.
          </Tip>
      parameters:
        - name: category
          in: query
          description: |
            Return only quotes in this category. Must match a category returned by
            `GET /categories` exactly (including spaces, e.g. `marco original`).
            If the value is unknown, the API responds with `400` and `invalid_category`.
          required: false
          schema:
            $ref: "#/components/schemas/Category"
          examples:
            wisdom:
              summary: Wisdom only
              value: wisdom
            marco_original:
              summary: Category with a space in the name
              value: marco original
            motivation:
              summary: Motivation quotes
              value: motivation
        - name: limit
          in: query
          description: |
            Maximum number of quotes to return after filtering. If omitted, all matching quotes
            are returned. Must be a positive integer (`>= 1`); non-integers and zero are rejected
            with `400` / `invalid_limit`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            description: Positive integer; upper bound is the number of matching quotes
          example: 5
          examples:
            small_page:
              summary: First 3 quotes
              value: 3
            default_size:
              summary: Five results
              value: 5
      responses:
        "200":
          description: Successfully retrieved quotes and a total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListQuotesResponse"
              examples:
                mixed:
                  summary: Filtered list with total
                  value:
                    quotes:
                      - id: "7"
                        text: "Yesterday I was clever, so I wanted to change the world. Today I am wise, so I am changing myself."
                        author: "Rumi"
                        category: wisdom
                      - id: "8"
                        text: "In three words I can sum up everything I've learned about life: it goes on."
                        author: "Robert Frost"
                        category: wisdom
                    total: 2
                limited:
                  summary: Limit applied
                  value:
                    quotes:
                      - id: "1"
                        text: "The only way to do great work is to love what you do."
                        author: "Steve Jobs"
                        category: motivation
                    total: 1
        "400":
          $ref: "#/components/responses/BadRequest"

  /quotes/random:
    get:
      # ⚠️  Terse baseline — exactly the kind of one-liner you see in the wild.
      summary: Random quote
      description: Returns one quote.
      operationId: getRandomQuote
      tags:
        - Quotes
      # ✅  Rich override via x-mint.metadata + x-mint.content.
      x-mint:
        metadata:
          title: Fetch a single random quote
          sidebarTitle: Get random quote
          description: |
            Return one quote chosen uniformly at random from the full dataset, or from a single
            category if `category` is supplied. The classic choice for daily-quote widgets, splash
            screens, AI prompt seeding, and "quote of the day" notifications.
        content: |
          <Tip>
            Pair this endpoint with [`GET /categories`](/api-reference/list-categories) so your
            clients can offer a category picker without hard-coding values that may drift over time.
          </Tip>
      parameters:
        - name: category
          in: query
          description: |
            If set, the random quote is drawn only from this category. Must be a valid category
            string (see `GET /categories`).
          required: false
          schema:
            $ref: "#/components/schemas/Category"
          examples:
            philosophy:
              summary: Random philosophy quote
              value: philosophy
            technology:
              summary: Random technology quote
              value: technology
      responses:
        "200":
          description: A single randomly selected quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                sample:
                  summary: Example random quote
                  value:
                    id: "12"
                    text: "Any sufficiently advanced technology is indistinguishable from magic."
                    author: "Arthur C. Clarke"
                    category: technology
        "400":
          $ref: "#/components/responses/BadRequest"

  /quotes/{id}:
    get:
      # ⚠️  Terse baseline.
      summary: Get quote
      description: Returns a quote.
      operationId: getQuoteById
      tags:
        - Quotes
      # ✅  Rich override via x-mint.metadata + x-mint.content.
      x-mint:
        metadata:
          title: Retrieve a quote by its unique ID
          sidebarTitle: Get quote by ID
          description: |
            Fetch the single quote whose `id` matches the path segment. IDs are opaque, server-assigned
            strings — durable across deployments — so they're safe to persist in saved-quote lists,
            permalinks, or analytics events.
        content: |
          <Note>
            **Looking for an ID?** Call [`GET /quotes`](/api-reference/list-quotes) first; every entry
            in the response includes its `id` field. Storing the `id` (rather than the quote text) is
            the recommended way to build favorites or share links.
          </Note>
      parameters:
        - name: id
          in: path
          description: |
            Unique quote identifier assigned by the API (string). Use values returned in list or
            random responses.
          required: true
          schema:
            type: string
            minLength: 1
            description: Quote id
          example: "7"
          examples:
            first:
              summary: Numeric string id
              value: "1"
            rumi:
              summary: Quote 7
              value: "7"
            marco:
              summary: Marco original quote id
              value: "16"
      responses:
        "200":
          description: The requested quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                by_id:
                  summary: Quote 7
                  value:
                    id: "7"
                    text: "Yesterday I was clever, so I wanted to change the world. Today I am wise, so I am changing myself."
                    author: "Rumi"
                    category: wisdom
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      # ⚠️  Terse baseline — left WITHOUT an `x-mint` override on purpose,
      #     because this endpoint is overridden through an MDX page instead
      #     (see api-reference/list-categories.mdx). Two approaches, same goal.
      summary: Categories
      description: Returns categories.
      operationId: listCategories
      tags:
        - Categories
      responses:
        "200":
          description: Alphabetically sorted list of category names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
              examples:
                default:
                  summary: Current categories
                  value:
                    categories:
                      - marco original
                      - motivation
                      - philosophy
                      - technology
                      - wisdom

components:
  schemas:
    Quote:
      type: object
      description: A single quote record
      required:
        - id
        - text
        - author
        - category
      properties:
        id:
          type: string
          description: Unique identifier for the quote
          example: "7"
        text:
          type: string
          description: Full text of the quote
          example: "Yesterday I was clever, so I wanted to change the world. Today I am wise, so I am changing myself."
        author:
          type: string
          description: Person attributed with the quote
          example: "Rumi"
        category:
          $ref: "#/components/schemas/Category"

    Category:
      type: string
      description: |
        One of the categories returned by `GET /categories`. Values are case-sensitive and may
        include spaces.
      enum:
        - marco original
        - motivation
        - philosophy
        - technology
        - wisdom
      example: wisdom

    ListQuotesResponse:
      type: object
      description: Payload for `GET /quotes`
      required:
        - quotes
        - total
      properties:
        quotes:
          type: array
          description: Quotes after optional category filter and limit slice
          items:
            $ref: "#/components/schemas/Quote"
        total:
          type: integer
          format: int32
          minimum: 0
          description: Number of quotes in the `quotes` array (same as `quotes.length`)
          example: 3

    CategoriesResponse:
      type: object
      description: Payload for `GET /categories`
      required:
        - categories
      properties:
        categories:
          type: array
          description: Sorted list of distinct category names
          items:
            $ref: "#/components/schemas/Category"
          example:
            - marco original
            - motivation
            - philosophy
            - technology
            - wisdom

    Error:
      type: object
      description: Standard error envelope for all error responses
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: invalid_category
        message:
          type: string
          description: Human-readable explanation, often including valid options
          example: "Category 'foo' does not exist. Valid categories: marco original, motivation, philosophy, technology, wisdom"

  responses:
    BadRequest:
      description: Invalid query parameter (e.g. unknown category or non-positive limit)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_category:
              summary: Unknown category
              value:
                error: invalid_category
                message: "Category 'foo' does not exist. Valid categories: marco original, motivation, philosophy, technology, wisdom"
            invalid_limit:
              summary: Limit not a positive integer
              value:
                error: invalid_limit
                message: limit must be a positive integer
    NotFound:
      description: No quote exists for the given id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing_quote:
              summary: Unknown id
              value:
                error: not_found
                message: "No quote found with id '99'"
